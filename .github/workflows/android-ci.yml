# Android CI: unit tests (protocol core) and a debug build. No signing, no secrets.
name: Android CI

on:
  push:
    branches: [main]
    paths: ["android-app/**", "spec/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android-app/**", "spec/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); AGP downloads missing platform/build-tools.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-ci-results
          path: |
            android-app/core/build/reports/tests/
            android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
