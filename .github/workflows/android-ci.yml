# Android CI: unit tests (protocol core) and a debug build. No signing, no secrets.
name: Android CI

on:
  push:
    branches: [main]
    paths: ["android-app/**", "spec/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["android-app/**", "spec/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME); AGP downloads missing platform/build-tools.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test
      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ci-results
          path: |
            android-app/core/build/reports/tests/
            android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
