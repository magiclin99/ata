# Builds both apps and publishes them as one GitHub Release, on every push to main that changes an app or the spec.
#
#   ATA.apk  (+ .sha256)          Android app, signed with ATA's Android key
#   ATA.dmg  (+ .sha256)          Mac app, signed with ATA's own certificate (mac-app/signing/ata-signing-cert.pem)
#   ATA-<version>.zip (+ .sha256) Mac app as a zip, for install.sh
#   install.sh (+ .sha256), SHA256SUMS.txt
# The release is marked latest, so these links always point at the newest build:
#   https://github.com/magiclin99/ata/releases/latest/download/ATA.apk   (…/ATA.dmg, …/install.sh)
#
# Version: one number for both apps and the tag. N = run number of this workflow (+ repository variable
# ATA_BUILD_OFFSET, default 0). Version 1.1.N, tag v1.1.N; Android versionCode and Mac CFBundleVersion 1000 + N.
# Every run gets a higher N, so every build installs over the previous one. A re-run keeps its N. If the workflow is
# ever renamed or recreated (the run number restarts), the prepare job refuses to publish a version that is not newer
# than the latest release; set ATA_BUILD_OFFSET (Settings → Secrets and variables → Actions → Variables) to fix it.
#
# Required repository secrets (internal/set-ci-secrets.sh sets them from ~/ata-secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   MAC_SIGNING_P12_BASE64, MAC_SIGNING_P12_PASSWORD
# If any is missing, the run ends successfully with a notice and builds and publishes nothing: never an unsigned or
# debug-signed build. Both signatures are checked against pinned certificates before anything is published.
#
# Security: runs only on pushes to main and on manual runs of main by the repository owner (never on pull requests,
# so no outside code ever sees the secrets). Secrets are only given to the steps that sign; key files are written to
# the runner's temp folder and deleted at the end of the job.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "mac-app/**"
      - "SPEC.md"
      - "spec/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions: {}   # nothing by default; each job asks for what it needs

concurrency:
  group: release
  cancel-in-progress: false   # never interrupt a publish; a newer push waits (and replaces an older waiting one)

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - id: secrets
        env:
          HAS_1: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_3: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_4: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_5: ${{ secrets.MAC_SIGNING_P12_BASE64 != '' }}
          HAS_6: ${{ secrets.MAC_SIGNING_P12_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_1" = true ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAS_2" = true ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_3" = true ] || missing="$missing ANDROID_KEY_ALIAS"
          [ "$HAS_4" = true ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ "$HAS_5" = true ] || missing="$missing MAC_SIGNING_P12_BASE64"
          [ "$HAS_6" = true ] || missing="$missing MAC_SIGNING_P12_PASSWORD"
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing published::Signing secrets missing:$missing. Nothing was built or published. Run internal/set-ci-secrets.sh (owner) and push again or run this workflow by hand."
          fi

      - id: version
        if: steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OFFSET: ${{ vars.ATA_BUILD_OFFSET }}
        run: |
          set -euo pipefail
          case "${OFFSET:-0}" in ''|*[!0-9]*) echo "ATA_BUILD_OFFSET must be a whole number" >&2; exit 1 ;; esac
          n=$(( GITHUB_RUN_NUMBER + ${OFFSET:-0} ))
          version="1.1.$n"
          build=$(( 1000 + n ))
          latest="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          latest="${latest#v}"
          if [ -n "$latest" ]; then
            newest="$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)"
            if [ "$version" = "$latest" ] || [ "$newest" != "$version" ]; then
              echo "::error::Version $version is not newer than the latest release ($latest). If this run was already published, there is nothing to do. Otherwise raise the repository variable ATA_BUILD_OFFSET."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ATA $version (build $build), previous release ${latest:-none}"

  android:
    needs: prepare
    if: needs.prepare.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Test
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ata-android.p12"

      - name: Build the signed APK
        env:
          ATA_SIGNING_STORE_FILE: ${{ runner.temp }}/ata-android.p12
          ATA_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATA_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATA_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease "-Pata.versionCode=$BUILD" "-Pata.versionName=$VERSION"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ata-android.p12"

      - name: Check the signature and version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "no signed APK at $apk (unsigned builds are named app-release-unsigned.apk)" >&2; exit 1; }
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --min-sdk-version 28 "$apk"
          want="$(tr -d ' \n' < signing/release-cert.sha256)"
          got="$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          signers="$("$bt/apksigner" verify --print-certs "$apk" | grep -c '^Signer #[0-9]* certificate SHA-256' || true)"
          if [ "$signers" != 1 ] || [ "$got" != "$want" ]; then
            echo "APK is not signed with ATA's Android key (got: $got, want: $want)" >&2; exit 1
          fi
          badging="$("$bt/aapt2" dump badging "$apk" | head -n1)"
          echo "$badging"
          case "$badging" in *"versionCode='$BUILD'"*"versionName='$VERSION'"*) ;; *) echo "wrong version in APK" >&2; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/ATA.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: ${{ runner.temp }}/out/ATA.apk
          if-no-files-found: error
          retention-days: 3

  mac:
    needs: prepare
    if: needs.prepare.outputs.configured == 'true'
    runs-on: macos-15
    timeout-minutes: 50
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac-app
    env:
      ATA_VERSION: ${{ needs.prepare.outputs.version }}
      ATA_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: |
          swift test
          python3 -I scripts/check-strings.py

      - name: Import the signing identity into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          kc="$RUNNER_TEMP/ata-signing.keychain-db"
          kcpw="$(openssl rand -hex 32)"
          echo "::add-mask::$kcpw"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ata-signing.p12"
          case "$P12_PASSWORD" in *'"'*|*\\*) echo "MAC_SIGNING_P12_PASSWORD must not contain \" or \\" >&2; exit 1 ;; esac
          # `security -i` reads these commands from stdin, so neither password appears in a process argument list.
          security -i >/dev/null <<EOF
          create-keychain -p "$kcpw" "$kc"
          set-keychain-settings -lut 3600 "$kc"
          unlock-keychain -p "$kcpw" "$kc"
          import "$RUNNER_TEMP/ata-signing.p12" -k "$kc" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc"
          EOF
          rm -f "$RUNNER_TEMP/ata-signing.p12"
          printf '%s' "$kcpw" > "$RUNNER_TEMP/ata-keychain-password"
          echo "ATA_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "ATA_SIGN_KEYCHAIN_PASSWORD_FILE=$RUNNER_TEMP/ata-keychain-password" >> "$GITHUB_ENV"
          security find-identity -p codesigning "$kc" | grep -q '1 identities found' \
            || { echo "the .p12 in MAC_SIGNING_P12_BASE64 did not import (wrong password?)" >&2; exit 1; }

      # release.sh refuses an app that isn't signed with signing/ata-signing-cert.pem, and checks the version.
      - name: Build, sign and package
        run: scripts/release.sh

      - name: Check the installer accepts it
        run: scripts/test-install.sh build/release/ATA.app

      - name: Remove the temporary keychain
        if: always()
        run: |
          if [ -n "${ATA_SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$ATA_SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/ata-keychain-password" "$RUNNER_TEMP/ata-signing.p12"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: |
            mac-app/dist/ATA.dmg
            mac-app/dist/ATA-${{ env.ATA_VERSION }}.zip
            mac-app/dist/install.sh
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [prepare, android, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # create the release and its tag
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # release notes list the commits since the previous release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/dl

      - name: Collect the files and checksums
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/dl/android/ATA.apk" "$RUNNER_TEMP/dl/mac/ATA.dmg" "$RUNNER_TEMP/dl/mac/ATA-$VERSION.zip" \
             "$RUNNER_TEMP/dl/mac/install.sh" "$out/"
          cmp -s "$out/install.sh" mac-app/install.sh || { echo "install.sh differs from the repository copy" >&2; exit 1; }
          cd "$out"
          set -- ATA.apk ATA.dmg "ATA-$VERSION.zip" install.sh
          for f in "$@"; do sha256sum "$f" > "$f.sha256"; done
          sha256sum "$@" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        run: |
          set -euo pipefail
          prev="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            range="$prev..$GITHUB_SHA"; since=" since ${prev#v}"
          else
            range="-15 $GITHUB_SHA"; since=""
          fi
          # Commit subjects of app/spec changes, newest first, with "android…:"/"mac…:" prefixes made readable.
          # shellcheck disable=SC2086
          git log --no-merges --format='%s' $range -- android-app mac-app SPEC.md spec \
            | sed -E 's/^android[^:]*: */Android app: /I; s/^mac[^:]*: */Mac app: /I' \
            | awk '!seen[$0]++' > "$RUNNER_TEMP/changes.txt"
          total="$(wc -l < "$RUNNER_TEMP/changes.txt" | tr -d ' ')"
          {
            echo "New version of ATA for your Android phone and your Mac."
            echo
            echo "- Phone: download **ATA.apk** on your phone and open it."
            echo "- Mac: download **ATA.dmg**, open it, and drag ATA into Applications."
            echo
            echo "Updating keeps your pairings and settings. Step-by-step help: https://magiclin99.github.io/ata/"
            if [ "$total" -gt 0 ]; then
              echo
              echo "What changed$since:"
              echo
              head -n 12 "$RUNNER_TEMP/changes.txt" | sed 's/^/- /'
              [ "$total" -le 12 ] || echo "- …and $((total - 12)) smaller changes"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Uploaded as a draft first and published in one step, so nobody sees a release with half its files.
      - name: Publish
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes   # leftover draft from a failed attempt
          fi
          gh release create "$tag" "$RUNNER_TEMP"/release/* -R "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "ATA $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest
          echo "::notice title=Published::ATA $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
